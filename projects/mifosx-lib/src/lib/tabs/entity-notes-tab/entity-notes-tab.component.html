<div class="tab-container mat-typography">

  <h3>{{ 'labels.heading.Notes' | translate }}</h3>

  <div>
    <form class="flex-row flex-justify-start flex-items-baseline flex-gap-20" #formRef="ngForm" [formGroup]="noteForm"
      (ngSubmit)="addNote()">
      <mat-form-field class="flex-w-calc-90">
        <textarea required formControlName="note" matInput placeholder="Write a note ...." cdkTextareaAutosize cdkAutosizeMinRows="2"></textarea>
      </mat-form-field>
      <button class="flex-initial" mat-raised-button color="primary" [disabled]="!noteForm.valid">
        <fa-icon icon="plus" class="m-r-10"></fa-icon>{{ 'labels.buttons.Add' | translate }}
      </button>
    </form>
  </div>

  <mat-list>
    <mat-list-item *ngFor="let entityNote of entityNotes; let i=index;">
      <fa-icon icon="sticky-note" matListIcon></fa-icon>
      <h3 matLine>{{ entityNote.note }} </h3>
      <p matLine>
        <span>Created by: {{entityNote.createdByUsername}}</span><br />
        <span>Date: {{entityNote.createdOn | dateFormat}}</span>
      </p>
      <div class="flex-row flex-justify-start">
        <button mat-button color="primary" (click)="editNote(entityNote.id, entityNote.note, i)">
          <fa-icon icon="edit"></fa-icon>
        </button>
        <button mat-button color="warn" (click)="deleteNote(entityNote.id, i)">
          <fa-icon icon="trash"></fa-icon>
        </button>
      </div>
    </mat-list-item>
  </mat-list>
</div>
