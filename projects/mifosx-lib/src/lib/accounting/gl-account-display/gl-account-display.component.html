<span *ngIf="accountTitle">
  <div class="flex-w-custom header" [ngStyle]="{ '--flex-max-width': withTitle }">
    {{'labels.inputs.' + accountTitle | translate}}
  </div>

  <div class="flex-w-custom" [ngStyle]="{ '--flex-max-width': withAccount }">
    {{glAccountValue()}}
  </div>
</span>

<div class="flex-w-100" *ngIf="!accountTitle">
  {{glAccountValue()}}
</div>
