<div class="flex-row-wrap flex-column-lt-md">

    <div class="flex-fill flex-w-98 flex-row-wrap flex-column-lt-md" *ngIf="accountingRule">
        <span class="flex-w-40">{{'labels.inputs.Type' | translate}}:</span>
        <span class="flex-w-60">{{'labels.accounting.' + getAccountingRuleName(accountingRule.value) | translate}}</span>
    </div>

    <div class="flex-fill flex-row-wrap flex-column-lt-md" *ngIf="isCashOrAccrualAccounting()">

        <h4 class="flex-fill mat-h4">{{'labels.heading.Assets' | translate}}</h4>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Saving reference'"
            [glAccount]="accountingMappings.savingsReferenceAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Overdraft portfolio'" *ngIf="accountingMappings.overdraftPortfolioControl"
            [glAccount]="accountingMappings.overdraftPortfolioControl" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Fees Receivable'" *ngIf="isAccrualAccounting()"
            [glAccount]="accountingMappings.feeReceivableAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Penalties Receivable'" *ngIf="isAccrualAccounting()"
            [glAccount]="accountingMappings.penaltyReceivableAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>

        <h4 class="flex-fill mat-h4">{{'labels.heading.Liabilities' | translate}}</h4>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Saving control'"
            [glAccount]="accountingMappings.savingsControlAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Savings transfers in suspense'"
            [glAccount]="accountingMappings.transfersInSuspenseAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Interest Payable'" *ngIf="isAccrualAccounting()"
            [glAccount]="accountingMappings.interestPayableAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Escheat liability'"
            *ngIf="accountingMappings.escheatLiabilityAccount" [glAccount]="accountingMappings.escheatLiabilityAccount"
            [withTitle]="'40%'">
        </mifosx-gl-account-display>

        <h4 class="flex-fill mat-h4">{{'labels.heading.Income' | translate}}</h4>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Income from fees'"
            [glAccount]="accountingMappings.incomeFromFeeAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Income from penalties'"
            [glAccount]="accountingMappings.incomeFromPenaltyAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Income from Interest'" *ngIf="accountingMappings.incomeFromInterest"
            [glAccount]="accountingMappings.incomeFromInterest" [withTitle]="'40%'">
        </mifosx-gl-account-display>

        <h4 class="flex-fill mat-h4">{{'labels.heading.Expenses' | translate}}</h4>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Interest on savings'"
            [glAccount]="accountingMappings.interestOnSavingsAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
        <mifosx-gl-account-display class="flex-w-100" [accountTitle]="'Write-off'" *ngIf="accountingMappings.writeOffAccount"
            [glAccount]="accountingMappings.writeOffAccount" [withTitle]="'40%'">
        </mifosx-gl-account-display>
    </div>

</div>
